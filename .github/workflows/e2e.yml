name: e2e

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
            install: |
              apt-get update -y
              apt-get install -y --no-install-recommends zsh git curl tmux ca-certificates neovim

          - name: ubuntu-24.04
            image: ubuntu:24.04
            install: |
              apt-get update -y
              apt-get install -y --no-install-recommends zsh git curl tmux ca-certificates neovim

          - name: debian-12
            image: debian:12
            install: |
              apt-get update -y
              apt-get install -y --no-install-recommends zsh git curl tmux ca-certificates neovim

          - name: fedora-40
            image: fedora:40
            install: |
              dnf install -y zsh git curl tmux neovim

          - name: rocky-9
            image: rockylinux:9
            install: |
              dnf install -y epel-release
              dnf install -y --allowerasing zsh git curl tmux neovim

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: ${{ matrix.install }}

      - name: Install chezmoi
        run: |
          curl -fsLS get.chezmoi.io | sh -s -- -b /usr/local/bin
          chezmoi --version

      - name: Run e2e tests
        env:
          REPO_DIR: ${{ github.workspace }}
        run: bash tests/container-test.sh
